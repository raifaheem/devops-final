services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_RaiF:/var/lib/postgresql/data
    networks:
      - devops-net_RaiF
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile_RaiF
    image: tg/todo-app:${APP_IMAGE_TAG}
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
      JPA_DDL_AUTO: update
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops-net_RaiF

volumes:
  pgdata_RaiF:

networks:
  devops-net_RaiF:
    driver: bridge
